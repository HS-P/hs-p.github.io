title: Hansol Park
email: gksthfdl5443@koreatech.ac.kr
description: >-
  Personal academic homepage of Hansol Park, focused on robot learning,
  dexterous manipulation, physical AI, and AI for robotics.
baseurl: ""
url: "https://hs-p.github.io"
lang: en
timezone: Asia/Seoul

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-sitemap

permalink: /posts/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - LICENSE
  - Gemfile.lock
  - vendor/
  - node_modules/
