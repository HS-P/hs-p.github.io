<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace }}">
    <meta name="author" content="{{ site.data.profile.name }}">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ site.data.profile.image | absolute_url }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <script>
      var pageEntryRoot = document.documentElement;
      var pageMotionEnabled = window.matchMedia("(prefers-reduced-motion: no-preference)").matches;
      window.__siteMotionHydrated = false;
      window.__failOpenPageMotion = function () {
        if (window.__startPageMotion) window.__startPageMotion();
        pageEntryRoot.classList.remove("page-motion-pending");
        pageEntryRoot.classList.add("page-motion-ready", "icons-ready");
        var typeSequence = document.querySelector("[data-typeseq]");
        if (typeSequence) typeSequence.classList.add("is-typed");
        var deferredArtwork = document.querySelector("img[data-deferred-src]");
        if (deferredArtwork) {
          deferredArtwork.src = deferredArtwork.getAttribute("data-deferred-src");
          deferredArtwork.removeAttribute("data-deferred-src");
          var artworkShell = deferredArtwork.closest("[data-allex-nav]");
          if (artworkShell) artworkShell.classList.add("is-artwork-visible");
        }
      };
      var stagePageEntry = false;
      try {
        stagePageEntry = Boolean(document.referrer) && new URL(document.referrer).origin === window.location.origin;
      } catch (error) {
        stagePageEntry = false;
      }

      if (pageMotionEnabled) {
        pageEntryRoot.classList.add("page-motion-pending");
        window.__startPageMotion = function () {
          if (window.__pageMotionStarted) return;
          window.__pageMotionStarted = true;
          window.clearTimeout(window.__pageMotionFallback);
          pageEntryRoot.classList.add("page-motion-ready");
          document.dispatchEvent(new Event("page-motion-start"));
        };
        window.__pageMotionFallback = window.setTimeout(window.__startPageMotion, 1200);
        window.__siteMotionFailureFallback = window.setTimeout(function () {
          if (!window.__siteMotionHydrated) window.__failOpenPageMotion();
        }, 1600);
      }

      if (stagePageEntry && pageMotionEnabled) {
        pageEntryRoot.classList.add("page-entry-internal");
        pageEntryRoot.classList.add("page-entry-pending");
        window.__pageEntryFallback = window.setTimeout(function () {
          pageEntryRoot.classList.add("page-entry-ready");
          if (!window.__pageEntryStarted) {
            window.__pageEntryStarted = true;
            document.dispatchEvent(new Event("page-entry-start"));
          }
          window.setTimeout(function () {
            pageEntryRoot.classList.remove("page-entry-pending", "page-entry-ready");
          }, 720);
        }, 650);
      }
    </script>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicons/hamburger.svg' | relative_url }}">
    {% if page.url == '/' %}
      <link rel="preload" as="image" type="image/webp" href="{{ '/assets/img/profile/qqq-512.webp' | relative_url }}" fetchpriority="high">
      <script>
        if (stagePageEntry && window.matchMedia("(min-width: 981px)").matches) {
          var homeArtPreload = document.createElement("link");
          homeArtPreload.rel = "preload";
          homeArtPreload.as = "image";
          homeArtPreload.type = "image/webp";
          homeArtPreload.href = "{{ '/assets/img/allex/allex-official-hero-source.webp' | relative_url }}";
          homeArtPreload.fetchPriority = "low";
          homeArtPreload.setAttribute("data-entry-defer", "");
          document.head.appendChild(homeArtPreload);
        }
      </script>
    {% elsif page.url == '/projects/' %}
      <link rel="preload" as="image" type="image/webp" href="{{ '/assets/img/allex/hero-allex.webp' | relative_url }}" media="(min-width: 981px)" fetchpriority="low" data-entry-defer>
    {% endif %}
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css"></noscript>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/mobile.css' | relative_url }}" media="(max-width: 760px)">
  </head>
  <body class="{% if page.url == '/' %}home-page{% else %}sub-page{% endif %}">
    {% include site-header.html %}
    {% include orb-nav.html %}
    <main class="page-shell{% if page.url == '/projects/' or page.layout == 'project-detail' or page.layout == 'award-detail' %} page-shell--wide{% endif %}">
      {{ content }}
    </main>
    {% if page.url == '/' %}
      <div class="allex-route-transition" data-allex-route-transition aria-hidden="true"></div>
    {% endif %}
    {% include site-footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" onerror="window.__failOpenPageMotion && window.__failOpenPageMotion()"></script>
  </body>
</html>
