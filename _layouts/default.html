<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace }}">
    <meta name="author" content="{{ site.data.profile.name }}">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ site.data.profile.image | absolute_url }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicons/hamburger.svg' | relative_url }}">
    {% if page.url == '/projects/' %}<link rel="preload" as="image" href="{{ '/assets/img/allex/hero-allex.png' | relative_url }}" media="(min-width: 761px)" fetchpriority="high">{% endif %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/mobile.css' | relative_url }}" media="(max-width: 760px)">
  </head>
  <body class="{% if page.url == '/' %}home-page{% else %}sub-page{% endif %}">
    {% include site-header.html %}
    {% include orb-nav.html %}
    <main class="page-shell{% if page.url == '/projects/' or page.layout == 'project-detail' or page.layout == 'award-detail' %} page-shell--wide{% endif %}">
      {{ content }}
    </main>
    {% if page.url == '/' %}
      <div class="allex-route-transition" data-allex-route-transition aria-hidden="true"></div>
    {% endif %}
    {% include site-footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
  </body>
</html>
