---
layout: default
---

<article class="prose-page{% if page.page_class %} {{ page.page_class }}{% endif %}">
  {% if page.page_class contains 'paper-sequence-page' %}
    <div class="paper-reveal" data-paper-reveal data-paper-reveal-surface aria-hidden="true">
      <span class="paper-reveal__face"></span>
      <span class="paper-reveal__crease paper-reveal__crease--upper"></span>
      <span class="paper-reveal__crease paper-reveal__crease--lower"></span>
      <span class="paper-reveal__edge"></span>
    </div>
  {% endif %}
  <header class="page-title">
    <h1>{{ page.display_title | default: page.title }}</h1>
    {% if page.description %}
      <p>{{ page.description }}</p>
    {% endif %}
  </header>
  {{ content }}
</article>
