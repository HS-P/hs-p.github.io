---
layout: default
---

<article class="prose-page{% if page.page_class %} {{ page.page_class }}{% endif %}">
  <header class="page-title">
    <h1>{{ page.display_title | default: page.title }}</h1>
    {% if page.description %}
      <p>{{ page.description }}</p>
    {% endif %}
  </header>
  {{ content }}
</article>
